name: Build Executable (Ubuntu 24.04)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Detect app directory
        run: |
          if [[ -f "medic/starting.py" ]]; then
            echo "APP_DIR=medic" >> "$GITHUB_ENV"
          elif [[ -f "starting.py" ]]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "Could not find starting.py (expected at ./starting.py or ./medic/starting.py)"
            exit 1
          fi

      - name: Install Linux system dependencies (Qt runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-sync1 \
            libxcb-xinerama0 \
            libxcb-xinput0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$APP_DIR/requirements.txt"
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          EXTRA_DATA=()

          [[ -d "$APP_DIR/res" ]] && EXTRA_DATA+=(--add-data "$APP_DIR/res:res")
          [[ -d "$APP_DIR/styles" ]] && EXTRA_DATA+=(--add-data "$APP_DIR/styles:styles")
          [[ -f "$APP_DIR/manufacturers.csv" ]] && EXTRA_DATA+=(--add-data "$APP_DIR/manufacturers.csv:.")
          [[ -f "$APP_DIR/master_products.csv" ]] && EXTRA_DATA+=(--add-data "$APP_DIR/master_products.csv:.")
          [[ -f "$APP_DIR/licensing/public_key.json" ]] && EXTRA_DATA+=(--add-data "$APP_DIR/licensing/public_key.json:licensing")
          [[ -f "$APP_DIR/purchase/med-template.ods" ]] && EXTRA_DATA+=(--add-data "$APP_DIR/purchase/med-template.ods:purchase")

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name ProcureMedic \
            --collect-all PySide6 \
            "${EXTRA_DATA[@]}" \
            "$APP_DIR/starting.py"

      - name: Archive build output
        run: |
          tar -czf ProcureMedic-ubuntu-24.04.tar.gz -C dist ProcureMedic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProcureMedic-ubuntu-24.04
          path: ProcureMedic-ubuntu-24.04.tar.gz
