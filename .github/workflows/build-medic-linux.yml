name: Build Procure Medics (Debian 12)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3 \
            python3-venv \
            python3-pip \
            python3-dev \
            build-essential \
            libglib2.0-0 \
            libgl1-mesa-glx \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-sync1 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libx11-xcb1 \
            libxcb-cursor0 \
            patchelf

      - name: Create virtual environment
        run: |
          python3 -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: |
          . venv/bin/activate
          pip install -r medic/requirements.txt

      - name: Ensure public key exists
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("medic/licensing/public_key.json")
          if not path.exists():
              raise SystemExit("public_key.json is missing")

          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, dict) or not data.get("n") or not data.get("e"):
              raise SystemExit("public_key.json is not configured with a valid public key")

          print("public_key.json is present and configured")
          PY

      - name: Build packaged app
        run: |
          . venv/bin/activate
          python -m PyInstaller --clean --noconfirm --onedir --windowed \
            --name procure-medics \
            --add-data "medic/licensing/public_key.json:licensing" \
            --add-data "medic/manufacturers.csv:." \
            --add-data "medic/master_products.csv:." \
            --add-data "medic/purchase/med-template.ods:purchase" \
            --add-data "medic/res:res" \
            --add-data "medic/styles:styles" \
            medic/starting.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: procure-medics-linux
          path: dist/procure-medics/
